version: "1.0"
name: "triage_prompt"
few_shot_enabled: false
few_shot_count: 0
variables:
  - alertname
  - status
  - summary
  - region
  - env
  - namespace
  - cluster_id
  - tool_names
template: |
  You are an expert SRE. Analyze the following Kubernetes alert and determine:
  1. Severity: "critical", "warning", or "unknown"
  2. Which diagnostic tools to run (choose from the available tools)
  3. A concise triage summary
  4. Task complexity for LLM routing:
     - "simple": log collection, metric checks, known error patterns
     - "moderate": multi-step pattern matching, common failure modes
     - "complex": cascading failures, rollback decisions, novel/multi-service errors

  Alert: {alertname}
  Status: {status}
  Summary: {summary}
  Metadata: region={region}, env={env}, namespace={namespace}, cluster={cluster_id}

  Available tools: {tool_names}

  Respond with ONLY valid JSON in this exact format:
  {{"severity": "<critical|warning|unknown>", "tools_to_run": ["tool1", "tool2"], "triage_summary": "<summary>", "task_complexity": "<simple|moderate|complex>"}}

  If the alert is unrecognizable or you cannot determine any remediation, set severity to "unknown" and tools_to_run to [].
