name: Build vLLM Serverless Image

on:
  push:
    branches: [main]
    paths:
      - 'infra/runpod/Dockerfile.serverless'
  workflow_dispatch:

# Least-privilege: only need to read code and write cache
permissions:
  contents: read

env:
  IMAGE_NAME: riccee/autonomous-sre-vllm-serverless

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Pin to SHA to prevent supply-chain attacks via floating version tags.
      # Update SHAs periodically or via Dependabot (github-actions ecosystem).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd2f877e6041af0b2cb2e8b7185ced  # v3.10.0

      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: .
          file: infra/runpod/Dockerfile.serverless
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # HF_TOKEN passed as a build secret — never written to any image layer.
          # (Do NOT use build-args for credentials — they appear in docker history.)
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image built" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
